<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.638 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v3.417'/><path d='M14.62 18.8A2.25 2.25 0 1 1 18 15.836a2.25 2.25 0 1 1 3.38 2.966l-2.626 2.856a.998.998 0 0 1-1.507 0z'/></svg>">

    <link rel="stylesheet" href="./github-markdown.min.css">
    <link rel="stylesheet" href="./github.min.css">
    
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background-color: #f6f8fa; }
        .header {
            background: #24292f; padding: 12px 20px; display: flex; align-items: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn {
            padding: 6px 14px; border: none; border-radius: 6px; 
            color: white; cursor: pointer; font-size: 13px; font-weight: 600; margin-right: 10px;
            display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
        }
        .btn-upload { background-color: #2da44e; }
        .btn-upload:hover { background-color: #2c974b; }
        .btn-clear { background-color: #6e7781; }
        .btn-clear:hover { background-color: #57606a; }
        
        .file-info { color: #adb5bd; font-size: 13px; border-left: 1px solid #444; padding-left: 15px; margin-left: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; }
        
        .lang-selector {
            background-color: #31363c; color: white; border: 1px solid #444;
            border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;
            margin-left: 15px; outline: none;
        }

        input[type="file"] { display: none; }
        
        .markdown-body {
            max-width: 900px; margin: 30px auto; padding: 45px;
            background: #fff; border-radius: 6px; border: 1px solid #d0d7de;
            min-height: 80vh;
        }
        .empty-text { text-align: center; color: #6e7781; margin-top: 150px; }
        @media (max-width: 767px) { .markdown-body { padding: 15px; margin: 10px; } }
    </style>
</head>
<body>

    <div class="header">
        <label for="file-upload" class="btn btn-upload">
            <span id="txt-btn-upload">📂 选择文件</span>
        </label>
        <input id="file-upload" type="file" accept=".md,.txt" />
        
        <button id="btn-clear" class="btn btn-clear">
            <span id="txt-btn-clear">🗑️ 清空内容</span>
        </button>
        
        <span id="file-name" class="file-info">未读取任何文件</span>

        <select id="lang-select" class="lang-selector">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <article id="content" class="markdown-body"></article>

    <script src="./marked.min.js"></script>
    <script src="./highlight.min.js"></script>
    
    <script>
        const i18n = {
            zh: {
                title: "离线 Markdown 阅读器",
                upload: "📂 选择文件",
                clear: "🗑️ 清空内容",
                noFile: "未读取任何文件",
                currentFile: "当前文件: ",
                welcomeTitle: "欢迎使用离线 Markdown 查看器",
                welcomeSub: "请点击左上角按钮载入本地文件"
            },
            en: {
                title: "Offline Markdown Viewer",
                upload: "📂 Open File",
                clear: "🗑️ Clear",
                noFile: "No file selected",
                currentFile: "File: ",
                welcomeTitle: "Welcome to Markdown Viewer",
                welcomeSub: "Click the button to load a file"
            },
            ja: {
                title: "オフライン Markdown ビューア",
                upload: "📂 ファイルを選択",
                clear: "🗑️ 内容をクリア",
                noFile: "ファイルが選択されていません",
                currentFile: "現在のファイル: ",
                welcomeTitle: "オフライン Markdown ビューアへようこそ",
                welcomeSub: "左上のボタンからファイルを読み込んでください"
            }
        };

        const fileUpload = document.getElementById('file-upload');
        const fileNameSpan = document.getElementById('file-name');
        const contentArea = document.getElementById('content');
        const btnClear = document.getElementById('btn-clear');
        const langSelect = document.getElementById('lang-select');
        
        const txtBtnUpload = document.getElementById('txt-btn-upload');
        const txtBtnClear = document.getElementById('txt-btn-clear');

        let currentLang = localStorage.getItem('md-viewer-lang') || 'zh';
        let currentFileName = "";
        let isFileLoaded = false; // 标记是否已经加载了文件

        // 初始化配置 Marked
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        function updateInterface() {
            const t = i18n[currentLang];
            
            // 更新标题和按钮文字
            document.title = t.title;
            txtBtnUpload.textContent = t.upload;
            txtBtnClear.textContent = t.clear;
            langSelect.value = currentLang;

            // 更新文件名显示
            if (!currentFileName) {
                fileNameSpan.textContent = t.noFile;
            } else {
                fileNameSpan.textContent = t.currentFile + currentFileName;
            }

            // 如果当前没有加载文件，则显示对应语言的欢迎语
            if (!isFileLoaded) {
                contentArea.innerHTML = `
                    <div class="empty-text">
                        <h2>${t.welcomeTitle}</h2>
                        <p>${t.welcomeSub}</p>
                    </div>`;
            }
        }

        // 文件上传逻辑
        fileUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            currentFileName = file.name;
            isFileLoaded = true;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                contentArea.innerHTML = marked.parse(event.target.result);
                updateInterface(); // 更新文件名显示
                window.scrollTo(0, 0);
            };
            reader.readAsText(file);
        });

        // 清空按钮逻辑
        btnClear.addEventListener('click', () => {
            fileUpload.value = ''; // 彻底清除上传记录
            currentFileName = "";
            isFileLoaded = false;
            updateInterface(); // 刷新界面回到欢迎状态
        });

        // 语言切换逻辑
        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('md-viewer-lang', currentLang);
            updateInterface();
        });

        // 页面启动
        updateInterface();
    </script>
</body>
</html>
